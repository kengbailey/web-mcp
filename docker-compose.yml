# Web MCP (LAN). Copy runtime.env.example to runtime.env (chmod 600) and fill it in.
services:
  gluetun:
    profiles: ["vpn"]
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER
      - VPN_TYPE
      - OPENVPN_CUSTOM_CONFIG=/gluetun/custom/config.ovpn
      - OPENVPN_USER
      - OPENVPN_PASSWORD
      - HTTPPROXY=on
    volumes:
      - ./gluetun:/gluetun
    ports:
      - "8888:8888"
    restart: unless-stopped


  web-mcp:
    build: .
    image: ${WEB_MCP_IMAGE:-web-mcp:latest}
    container_name: web-mcp
    ports:
      - "${MCP_BIND_ADDRESS:-0.0.0.0}:${MCP_HOST_PORT:-3090}:3090"
    networks:
      default:
        aliases: [webintel-mcp]  # pre-rename name, for existing clients/scripts
    env_file:
      - path: ${WEB_MCP_ENV_FILE:-./runtime.env}
        format: raw
    restart: unless-stopped
