# Cloud (GCP VM) deployment for Web MCP.
#
# Differences vs the LAN docker-compose.yml:
#   - No Gluetun VPN: every tool egresses directly through the VM's datacenter IP
#     (YOUTUBE_PROXY_URL can route YouTube through a residential proxy).
#   - OAuth 2.1 (WorkOS AuthKit) + HMAC-JWT auth via env vars (src/server/auth.py).
#   - web-mcp binds 127.0.0.1 only; cloudflared is the sole public ingress.
#
# Ingress: the remote-managed Cloudflare Tunnel's public hostname points at
# http://webintel-mcp:3090. The service was renamed to web-mcp; the network alias
# below keeps that tunnel target working until the dashboard is updated.
#
# Usage (normally run by deploy/scripts/bootstrap.sh):
#   docker compose -f docker-compose.cloud.yml --env-file /opt/webintel.env up -d --build
services:
  web-mcp:
    build: .
    image: web-mcp:latest
    container_name: web-mcp
    ports:
      - "127.0.0.1:3090:3090"   # localhost only; cloudflared reaches it over the compose network
    networks:
      default:
        aliases: [webintel-mcp]
    environment:
      # Explicit ${VAR:-} interpolation: values come from the file passed via
      # `docker compose --env-file` (see deploy/scripts/bootstrap.sh). Bare
      # pass-through entries (`- VAR`) read only the shell environment, NOT
      # the --env-file, and would silently start the server with auth off.
      - MCP_HOST=0.0.0.0
      - MCP_TRANSPORT=http
      - EXA_API_KEY=${EXA_API_KEY:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - STT_ENDPOINT=${STT_ENDPOINT:-}
      - STT_MODEL=${STT_MODEL:-}
      - STT_FALLBACK_MODEL=${STT_FALLBACK_MODEL:-}
      - STT_API_KEY=${STT_API_KEY:-}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID:-}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET:-}
      - REDDIT_USER_AGENT=${REDDIT_USER_AGENT:-}
      # YouTube egress via a residential proxy (empty = direct; see config.py)
      - YOUTUBE_PROXY_URL=${YOUTUBE_PROXY_URL:-}
      # Cloud auth (see src/server/auth.py). Leave empty to disable auth.
      - MCP_AUTHKIT_DOMAIN=${MCP_AUTHKIT_DOMAIN:-}
      - MCP_BASE_URL=${MCP_BASE_URL:-}
      - MCP_RESOURCE_URL=${MCP_RESOURCE_URL:-}
      - MCP_REQUIRED_SCOPES=${MCP_REQUIRED_SCOPES:-}
      - MCP_MACHINE_SECRET=${MCP_MACHINE_SECRET:-}
      # Issuer of already-minted machine JWTs; kept for compatibility.
      - MCP_MACHINE_ISSUER=${MCP_MACHINE_ISSUER:-webintel-internal}
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: web-mcp-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web-mcp
